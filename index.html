<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новогодний квест — Лабиринт</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .game {
      background: rgba(0,0,0,0.35);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 100vw;
    }

    h1 { margin-top: 0; font-size: 1.4rem; }
    .hint { font-size: 0.85rem; opacity: 0.85; margin-bottom: 10px; }

    canvas {
      background: #000;
      border-radius: 12px;
      box-shadow: inset 0 0 0 2px #2ecc71;
      margin-bottom: 10px;
      width: min(92vw, 92vh);
      aspect-ratio: 1 / 1;
    }

    .controls {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .controls button {
      font-size: 1.1rem;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #ecf0f1;
      cursor: pointer;
    }

    .controls button:active {
      transform: scale(0.95);
    }

    .win {
      display: none;
      margin-top: 12px;
      background: #2ecc71;
      color: #0b3d1f;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
    }

    .win a {
      display: inline-block;
      margin-top: 8px;
      color: #0b3d1f;
      text-decoration: underline;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="game">
  <h1>🎄 Новогодний лабиринт</h1>
  <div class="hint">Каждая ошибка — новый лабиринт. Видно только рядом с тобой 😈</div>

  <canvas id="maze" width="640" height="640"></canvas>

  <div class="controls">
    <button data-dir="up">⬆️</button>
    <div>
      <button data-dir="left">⬅️</button>
      <button data-dir="down">⬇️</button>
      <button data-dir="right">➡️</button>
    </div>
  </div>

  <div class="win" id="winBox">
    🎉 Ты это сделал!<br>
    <a href="https://youtube.com/shorts/ms6djNIsfXc?si=8FAp4YnTtUFrMBAE">
      Перейти ко второму этапу ▶️
    </a>
  </div>
</div>

<script>
const canvas = document.getElementById('maze');
const ctx = canvas.getContext('2d');

const SIZE = 21; // должен быть нечётным
const TILE = 32;
const VISIBILITY = 2;

let maze, player;

function generateMaze() {
  maze = Array.from({ length: SIZE }, () => Array(SIZE).fill(1));

  function carve(x, y) {
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].sort(() => Math.random() - 0.5);
    maze[y][x] = 0;

    for (const [dx, dy] of dirs) {
      const nx = x + dx * 2;
      const ny = y + dy * 2;
      if (
        ny > 0 && ny < SIZE-1 &&
        nx > 0 && nx < SIZE-1 &&
        maze[ny][nx] === 1
      ) {
        maze[y + dy][x + dx] = 0;
        carve(nx, ny);
      }
    }
  }

  carve(1,1);
  maze[SIZE-2][SIZE-2] = 2;
  player = { x: 1, y: 1 };
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for (let y=0; y<SIZE; y++) {
    for (let x=0; x<SIZE; x++) {
      const dist = Math.max(
        Math.abs(player.x - x),
        Math.abs(player.y - y)
      );

      if (dist > VISIBILITY) {
        ctx.fillStyle = '#000';
        ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
        continue;
      }

      if (maze[y][x] === 1) ctx.fillStyle = '#34495e';
      else if (maze[y][x] === 2) ctx.fillStyle = '#f1c40f';
      else ctx.fillStyle = '#111';

      ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
    }
  }

  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(
    player.x*TILE + TILE/2,
    player.y*TILE + TILE/2,
    TILE/3,
    0, Math.PI*2
  );
  ctx.fill();
}

function move(dx, dy) {
  const nx = player.x + dx;
  const ny = player.y + dy;

  if (!maze[ny] || maze[ny][nx] === undefined) return;

  if (maze[ny][nx] === 1) {
    generateMaze(); // телепорт + новая карта
    draw();
    return;
  }

  player.x = nx;
  player.y = ny;

  if (maze[ny][nx] === 2) {
    document.getElementById('winBox').style.display = 'block';
  }

  draw();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') move(0,-1);
  if (e.key === 'ArrowDown') move(0,1);
  if (e.key === 'ArrowLeft') move(-1,0);
  if (e.key === 'ArrowRight') move(1,0);
});

document.querySelectorAll('.controls button').forEach(b => {
  b.onclick = () => {
    if (b.dataset.dir === 'up') move(0,-1);
    if (b.dataset.dir === 'down') move(0,1);
    if (b.dataset.dir === 'left') move(-1,0);
    if (b.dataset.dir === 'right') move(1,0);
  };
});

generateMaze();
draw();
</script>
</body>
</html>
